name: Linger
options:
  bundleIdPrefix: cc.lingerphoto.learning
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  Portal:
    url: https://github.com/Aeastr/Portal.git
    from: 6.1.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
targets:
  Linger:
    type: application
    platform: iOS
    sources:
      - path: Linger
    dependencies:
      - package: Portal
        product: PortalTransitions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.lingerphoto.learning.Linger
        INFOPLIST_KEY_CFBundleDisplayName: Linger
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Linger 需要访问你的相册，以便随机回顾照片并在你确认后删除废片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Linger 需要相册权限以管理你标记删除的照片。
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: Linger/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Linger 需要访问你的相册，以便随机回顾照片并在你确认后删除废片。
        NSPhotoLibraryAddUsageDescription: Linger 需要相册权限以管理你标记删除的照片。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
  LingerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LingerTests
    dependencies:
      - target: Linger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.lingerphoto.learning.LingerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Linger:
    build:
      targets:
        Linger: all
        LingerTests: [test]
    test:
      targets:
        - LingerTests
